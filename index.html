<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#FAFAF8" />

    <!-- Static site-level tags only. The per-page title, description, canonical,
         and the rest of the Open Graph / Twitter tags are managed by the SeoHead
         component (react-helmet-async) and baked into each prerendered page.
         Deliberately no title element here, to avoid a duplicate alongside
         Helmet's. -->
    <meta property="og:site_name" content="Cassandra Wilcox Art" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LKH33ZGGF7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-LKH33ZGGF7');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
