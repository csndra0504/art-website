server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # This server sits behind a proxy on a different scheme/port, so nginx must
    # never build an absolute redirect from its own host:port — that would send
    # visitors to http://<host>:8080/... and drop TLS.
    absolute_redirect off;
    port_in_redirect off;

    # Serve the prerendered per-route file directly.
    #
    # Matching `$uri/index.html` (a FILE) rather than `$uri/` (a DIRECTORY) is
    # deliberate: a directory match makes nginx issue an implicit 301 to the
    # trailing-slash URL, which both breaks the canonical/sitemap URLs and, behind
    # a proxy, leaks the internal port. This way /events serves
    # /events/index.html with a plain 200 and the URL is left alone.
    # The final /index.html keeps the SPA fallback for unknown routes.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Never cache the HTML entrypoints so deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
